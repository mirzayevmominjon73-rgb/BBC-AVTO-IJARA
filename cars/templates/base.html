{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BBC AVTO IJARA{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'common/css/main.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top main-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'cars:home' %}">
            BBC AVTO IJARA
        </a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                <li class="nav-item"><a class="nav-link" href="{% url 'cars:about' %}">Biz haqimizda</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'cars:promo-list' %}">Promo</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'cars:electric-list' %}">Elektr</a></li>
                <li class="nav-item">
                    <a class="btn btn-warning fw-semibold ms-lg-3" href="{% url 'cars:contact' %}">
                        Bog‘lanish
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<main class="main-content">
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="main-footer">
    <div class="container text-center">
        <p class="mb-0">© 2026 BBC AVTO IJARA. Barcha huquqlar himoyalangan.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
