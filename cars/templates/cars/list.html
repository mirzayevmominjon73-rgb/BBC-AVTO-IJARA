{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>BBC AVTO IJARA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#eef2f7,#f8fbff);
}

/* Navbar */
.navbar{
    background:rgba(13,27,42,.95);
    backdrop-filter:blur(10px);
}
.navbar-brand{
    color:#00c2ff!important;
    font-weight:700;
    font-size:22px;
}

/* Hero */
.hero{
    background:linear-gradient(rgba(13,27,42,.75),rgba(13,27,42,.85)),
    url("https://images.unsplash.com/photo-1549924231-f129b911e442") center/cover;
    color:#fff;
    padding:110px 20px;
    text-align:center;
}
.hero h1{
    font-size:42px;
}
.hero p{
    font-size:18px;
    opacity:.9;
}

/* Filter tugmalar */
.filter-btn{
    border-radius:30px;
    font-weight:500;
    transition:.3s;
}
.filter-btn:hover{
    transform:translateY(-2px);
}

/* Search */
#searchInput{
    border-radius:30px;
    padding:15px 25px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

/* Car Card */
.car-card{
    border:none;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    background:#fff;
    transition:all .3s ease;
}
.car-card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 40px rgba(0,0,0,.12);
}

.card-img-top{
    height:230px;
    object-fit:cover;
    transition:transform .5s ease, opacity .5s;
}
.car-card:hover .card-img-top{
    transform:scale(1.05);
}

.car-price{
    color:#00b4d8;
    font-weight:600;
    font-size:18px;
}

/* Modal */
.modal-content{
    border-radius:20px;
    border:none;
}
.modal-header{
    border-bottom:none;
}
.modal-img{
    height:420px;
    object-fit:cover;
    border-radius:16px;
}

/* Info box */
.info-box{
    background:linear-gradient(135deg,#f1f3f5,#ffffff);
    border-radius:16px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.05);
}

/* Calculator */
#calculatorForm input{
    border-radius:12px;
}
#calculatorForm button{
    border-radius:30px;
    padding:10px;
    font-weight:600;
}

/* Responsive */
@media(max-width:768px){
    .hero h1{font-size:28px}
    .modal-img{height:250px}
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
<div class="container">
<a class="navbar-brand" href="/">BBC AVTO IJARA</a>
</div>
</nav>

<section class="hero">
<h1 class="fw-bold">Ishonchli Avto Ijara & Nasiya</h1>
<p>Zamonaviy avtomobillar • Qulay narx • Tez rasmiylashtirish</p>
</section>

<div class="container my-5">
<div class="text-center mb-4">
<button class="btn btn-outline-dark filter-btn me-2" data-endpoint="{% url 'cars_api:car-list' %}">Barchasi</button>
<button class="btn btn-outline-primary filter-btn me-2" data-endpoint="{% url 'cars_api:car-list' %}?type=auto">Avtomobillar</button>
<button class="btn btn-outline-danger filter-btn me-2" data-endpoint="{% url 'cars_api:car-list' %}?type=promo">🔥 Aksiyadagi mashinalar</button>
<button class="btn btn-outline-primary filter-btn me-2" data-endpoint="{% url 'cars_api:car-list' %}?type=electric">⚡️ Electric</button>
<button class="btn btn-outline-success filter-btn me-2" data-endpoint="{% url 'cars_api:car-list' %}?type=news">🆕 Yangiliklarimiz</button>
<button class="btn btn-outline-info filter-btn me-2" data-endpoint="{% url 'about' %}">ℹ️ Biz Haqimizda</button>
<button class="btn btn-outline-warning filter-btn me-2" data-endpoint="{% url 'contact' %}">📞 Bog‘lanish</button>
</div>

<input type="text" id="searchInput" class="form-control form-control-lg mb-4" placeholder="🚗 Mashina nomini yozing...">

<div class="row g-4" id="carList"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="carModal">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="carModalTitle"></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="carCarousel" class="carousel slide mb-3" data-bs-ride="carousel">
          <div class="carousel-inner" id="carouselInner"></div>
        </div>
        <p class="fw-bold fs-5" id="carPrice"></p>
        <div class="row text-center mb-3" id="carDetails"></div>
        <div class="info-box">
          <h6 class="fw-bold mb-2">💳 Nasiya kalkulyator</h6>
          <form id="calculatorForm" class="row g-2">
            <div class="col"><input id="downPayment" class="form-control" placeholder="Boshlang‘ich to‘lov" required></div>
            <div class="col"><input id="years" class="form-control" placeholder="Yil" required></div>
            <div class="col-12 d-grid"><button class="btn btn-primary">Hisoblash</button></div>
          </form>
          <div id="calculatorResult" class="mt-2 text-center"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<script>
function getCookie(name){
    let cookieValue=null;
    if(document.cookie && document.cookie!==''){
        document.cookie.split(';').forEach(c=>{
            if(c.trim().startsWith(name+'=')){
                cookieValue=decodeURIComponent(c.trim().substring(name.length+1));
            }
        });
    }
    return cookieValue;
}
axios.defaults.headers.common['X-CSRFToken'] = getCookie('csrftoken');

let endpoint = '{% url "cars_api:car-list" %}';
let carsData = [];
let hoverTimers = {};
let selectedCar = null;

// Mashinalarni yuklash
function loadCars(search=''){
    axios.get(endpoint + (endpoint.includes('?') ? '&' : '?') + 'search=' + encodeURIComponent(search))
    .then(res=>{
        carsData = res.data.results;
        carList.innerHTML = '';

        if(!carsData.length){
            carList.innerHTML = '<p class="text-danger">Hozircha mashina mavjud emas...</p>';
            return;
        }

        carsData.forEach(car=>{
            let img = car.images?.length
                ? car.images[0].image
                : '{% static "common/img/placeholder.png" %}';

            carList.innerHTML += `
            <div class="col-md-4">
                <div class="card car-card"
                    onmouseenter="startHover(${car.id})"
                    onmouseleave="stopHover(${car.id})"
                    onclick="openModal(${car.id})">
                    <img id="img-${car.id}" src="${img}" class="card-img-top">
                    <div class="card-body">
                        <h6 class="fw-bold">${car.title}</h6>
                        <p class="car-price">$${car.price}</p>
                    </div>
                </div>
            </div>`;
        });
    })
    .catch(err=>{
        console.log('Xato: ', err);
        carList.innerHTML='<p class="text-danger">Mashinalar yuklanmadi...</p>';
    });
}

// Hover efekt (rasmlar aylanishi)
function startHover(id){
    const car = carsData.find(c => c.id == id);
    if(!car || !car.images?.length) return;

    let i = 0;
    stopHover(id);

    hoverTimers[id] = setInterval(()=>{
        i = (i + 1) % car.images.length;
        const imgEl = document.getElementById(`img-${id}`);
        if(!imgEl) return;

        imgEl.style.opacity = 0;
        setTimeout(()=>{
            imgEl.src = car.images[i].image;
            imgEl.style.opacity = 1;
        }, 250);
    }, 1500);
}

function stopHover(id){
    if(hoverTimers[id]){
        clearInterval(hoverTimers[id]);
        hoverTimers[id] = null;
    }
}

// Modal ochish
function openModal(id){
    const car = carsData.find(c => c.id == id);
    if(!car){
        alert('Mashina topilmadi');
        return;
    }

    selectedCar = car;
    carModalTitle.innerText = car.title;
    carPrice.innerText = '$' + car.price;

    carDetails.innerHTML = `
        <div class="col"><b>Yil</b><br>${car.year || '-'}</div>
        <div class="col"><b>Rang</b><br>${car.color || '-'}</div>
        <div class="col"><b>Sarfi</b><br>${car.cpg || '-'}</div>
    `;

    carouselInner.innerHTML = '';

    if(car.images?.length){
        car.images.forEach((img, i)=>{
            carouselInner.innerHTML += `
            <div class="carousel-item ${i===0?'active':''}">
                <img src="${img.image}" class="modal-img w-100">
            </div>`;
        });
    } else {
        carouselInner.innerHTML = `
        <div class="carousel-item active">
            <img src="{% static 'common/img/placeholder.png' %}" class="modal-img w-100">
        </div>`;
    }

    new bootstrap.Modal(document.getElementById('carModal')).show();
}

// Filter tugmalar
document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
        const ep = btn.dataset.endpoint;

        // About yoki Contact sahifalariga redirect
        if(ep.includes('/about') || ep.includes('/contact')){
            window.location.href = ep;
            return;
        }

        // Filterlash
        endpoint = ep;
        loadCars(searchInput.value);
    });
});

// Search ishlashi
searchInput.oninput = e => loadCars(e.target.value);

// Nasiya kalkulyator
calculatorForm.onsubmit = e=>{
    e.preventDefault();
    if(!selectedCar) return;

    axios.post('{% url "cars_api:calculate-finance" %}',{
        car_id: selectedCar.id,
        down_payment: parseFloat(downPayment.value) || 0,
        years: parseInt(years.value) || 1
    }).then(res=>{
        calculatorResult.innerHTML = `
        <b>Oyma-oy:</b> $${res.data.monthly_payment}<br>
        <b>Umumiy:</b> $${res.data.total_payment}<br>
        <b>Qoldiq:</b> $${res.data.remaining}`;
    }).catch(()=>{
        calculatorResult.innerHTML='<p class="text-danger">Hisoblashda xatolik</p>';
    });
};

// Dastlab mashinalarni yuklash
loadCars();
</script>
</body>
</html>
